<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Electrical Engineering AI</title>

    <link rel="stylesheet" href="ai.css">

</head>

<body>

    <!-- AI Heading -->

    <h1>🤖 Electrical Engineering AI</h1>

    <!-- Chat Box -->

    <div id="chat">

        <div class="ai-message">
            👋 Hello Vijay!<br><br>
            Welcome to <b>Electrical Engineering AI Assistant</b>.<br><br>

            You can ask me about:
            <br><br>

            ⚡ Electrical Engineering<br>
            📚 BEU Notes<br>
            📄 PYQ Solutions<br>
            🔌 Electrical Machines<br>
            ⚙ Power System<br>
            💡 Digital Signal Processing<br>
            📖 NPTEL<br>
            🧮 Numerical Problems

        </div>

    </div>

    <!-- Chat Input -->

    <div class="chat-input">

        <input
            type="text"
            id="question"
            placeholder="Ask any Electrical Engineering Question...">

        <button onclick="sendQuestion()">

            🚀 Ask AI

        </button>

    </div>

    <script src="ai.js"></script>

</body>

</html>
